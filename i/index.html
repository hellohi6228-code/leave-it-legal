<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Leave it invite</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.25rem;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1c1908; background: #f6f5ef; text-align: center;
  }
  h1 { font-size: 2.1rem; margin: 0 0 .4rem; }
  p.sub { color: #6b6754; margin: 0 0 2rem; }
  .code { display: flex; gap: .45rem; justify-content: center; margin-bottom: .75rem; }
  .code span {
    width: 2.6rem; height: 3.2rem; border-radius: .7rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 800;
    background: rgba(255,255,255,.8); border: 1px solid rgba(58,53,32,.16);
  }
  .hint { font-size: .82rem; color: #6b6754; margin: 0 0 2rem; }
  a.btn {
    display: block; width: 100%; max-width: 22rem; margin: 0 auto .7rem;
    padding: 1rem 1.2rem; border-radius: 1rem; text-decoration: none;
    font-weight: 700; font-size: 1rem;
    background: #8a7a2e; color: #fff;
  }
  a.btn.ghost { background: rgba(255,255,255,.75); color: #1c1908; border: 1px solid rgba(58,53,32,.16); }
  #page { display: none; }
  #page.show { display: block; }
  footer { margin-top: 2.5rem; font-size: .8rem; color: #6b6754; }
  footer a { color: #8a7a2e; }
  @media (prefers-color-scheme: dark) {
    body { color: #eae7d9; background: #1c1908; }
    p.sub, .hint, footer { color: #9a9483; }
    .code span { background: rgba(255,255,255,.07); border-color: rgba(234,231,217,.18); }
    a.btn.ghost { background: rgba(255,255,255,.08); color: #eae7d9; border-color: rgba(234,231,217,.18); }
    footer a { color: #c8b95e; }
  }
</style>
</head>
<body>

<div id="page">
  <h1>Leave it.</h1>
  <p class="sub">Somebody invited you to a property</p>

  <div class="code" id="code"></div>
  <p class="hint" id="hint">Your invite code</p>

  <a class="btn" id="open" href="#">Open in Leave it</a>
  <a class="btn ghost" id="get" href="#">Get the app</a>

  <footer>
    <a href="../privacy.html">Privacy</a> &nbsp;·&nbsp; <a href="../terms.html">Terms</a>
  </footer>
</div>

<script>
/*
 * One link for a text message.
 *
 * With the app installed this page is never read: it hands the code straight
 * to the app and the phone switches away. Without it, the attempt fails
 * quietly and the page appears about a second later offering the store.
 *
 * The page starts hidden on purpose. Drawing it and then leaving is a flash
 * of the wrong thing on the way to the right one.
 *
 * The proper version of this is a universal link, which opens the app before
 * any of this runs and needs the Apple team id to set up. Until then a custom
 * scheme is the only handle a web page has on a native app, and on iOS a
 * scheme nobody claims raises "cannot open the page". The wait below is what
 * keeps that alert from landing on people who do have the app.
 */
var APP_STORE = '';   // https://apps.apple.com/app/idXXXXXXXXX once listed
var PLAY_STORE = '';

var params = new URLSearchParams(location.search);
var code = (params.get('c') || params.get('code') || '').replace(/[^0-9A-Za-z]/g, '').slice(0, 6);
var scheme = code ? 'leaveit://join?code=' + code : 'leaveit://';

function drawPage() {
  var box = document.getElementById('code');
  if (code) {
    code.split('').forEach(function (ch) {
      var s = document.createElement('span');
      s.textContent = ch;
      box.appendChild(s);
    });
    box.style.cursor = 'pointer';
    box.addEventListener('click', function () {
      navigator.clipboard && navigator.clipboard.writeText(code).then(function () {
        var h = document.getElementById('hint');
        h.textContent = 'Code copied';
        setTimeout(function () { h.textContent = 'Your invite code'; }, 1800);
      });
    });
  } else {
    document.getElementById('hint').textContent = 'Open the app and enter the code you were sent';
    box.remove();
  }

  document.getElementById('open').href = scheme;

  var store = /Android/i.test(navigator.userAgent || '') ? PLAY_STORE : APP_STORE;
  var get = document.getElementById('get');
  if (store) {
    get.href = store;
  } else {
    get.textContent = 'Coming to the App Store soon';
    get.removeAttribute('href');
    get.style.opacity = '.55';
  }

  document.getElementById('page').className = 'show';
}

/* A phone that switched to the app stops running timers and fires these, so
   whichever arrives first tells us the handoff worked. */
var handedOff = false;
['pagehide', 'blur'].forEach(function (e) {
  window.addEventListener(e, function () { handedOff = true; });
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) handedOff = true;
});

var started = Date.now();
setTimeout(function () {
  /* Back from a long pause means the app opened and the person returned, so
     the elapsed check catches what the events miss. */
  if (handedOff || document.hidden || Date.now() - started > 2200) return;
  drawPage();
}, 1100);

/* Coming back to this page from the app would otherwise bounce straight into
   it again, so the attempt happens once per visit. */
try {
  if (sessionStorage.getItem('tried') === scheme) {
    drawPage();
  } else {
    sessionStorage.setItem('tried', scheme);
    location.replace(scheme);
  }
} catch (e) {
  location.replace(scheme);
}
</script>

</body>
</html>
